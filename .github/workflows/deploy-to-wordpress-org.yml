name: Deploy to WordPress.org

# Publishes a release to the plugin directory.
#
# The directory serves whatever is in SVN, to every store that installs us, and
# SVN has no undo — so this runs only on a *published GitHub release* (a
# deliberate act), never on a stray tag push. Use the manual trigger to re-run a
# failed publish, or to rehearse one with dry_run.
#
# Requires one repository secret: WPORG_SVN_PASSWORD — the WordPress.org SVN
# password, which is separate from the wordpress.org account password and is set
# under Account & Security on the profile page.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.3.0'
        required: true
        type: string
      dry_run:
        description: 'Rehearse only — show what would be committed, change nothing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Never let two publishes race for the same SVN repo.
concurrency:
  group: wordpress-org-deploy
  cancel-in-progress: false

env:
  PLUGIN_SLUG: nitrosearch-for-woocommerce
  SVN_USER: nitrosearch
  SVN_URL: https://plugins.svn.wordpress.org/nitrosearch-for-woocommerce

jobs:
  deploy:
    name: Publish to the plugin directory
    runs-on: ubuntu-latest

    steps:
      # Two checkouts, deliberately. `release/` is the code we publish — exactly
      # what was tagged. `current/` supplies the guards and the listing images,
      # so policy and presentation are whatever they are today rather than
      # whatever they were when the tag was cut. Publishing an older tag then
      # still gets the newest safety checks, and cannot strip the listing page
      # of images that tag never contained.
      - name: Check out the released tag — the code being published
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: release

      # `ref:` is REQUIRED here. Without it checkout defaults to github.ref, which
      # on a release event is the tag itself — both checkouts would land on the
      # tag and the split above would silently do nothing.
      - name: Check out the default branch — guards and listing assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: current

      - name: Resolve and validate the version
        id: version
        env:
          # Via env, never inlined into the script — a tag name is untrusted input.
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # An ANCHORED regex, not a glob. `case v[0-9]*.[0-9]*.[0-9]*` accepts
          # `v1.0.0$(id)` and `v9.9.9;whoami` — both legal git tag names — and the
          # derived value is used by later steps in a job that holds the SVN
          # password. Match the whole string or refuse.
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to publish '$RAW_TAG' — expected exactly vX.Y.Z"
            exit 1
          fi
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${RAW_TAG#v}"

      - name: Pre-release guards
        env:
          PREFLIGHT_ROOT: ${{ github.workspace }}/release
          PREFLIGHT_ASSETS_DIR: ${{ github.workspace }}/current/.wordpress-org
          VERSION: ${{ steps.version.outputs.version }}
        run: current/bin/preflight-release.sh "$VERSION"

      - name: Build the shipping tree
        working-directory: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_SLUG: ${{ env.PLUGIN_SLUG }}
        run: |
          set -euo pipefail
          bin/build-plugin.sh
          # Unpack the allowlisted zip — publishing the same artifact users
          # download means the package can never drift from the release.
          mkdir -p build
          # Name derives from the slug, so the packaging slug and this step can never
          # disagree the way they did when the slug changed.
          unzip -q "dist/${PLUGIN_SLUG}-${VERSION}.zip" -d build

      - name: Install Subversion
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq subversion
          fi
          svn --version --quiet

      - name: Refuse to overwrite an existing tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if svn ls "$SVN_URL/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tags/$VERSION is already published. Cut a new version instead."
            exit 1
          fi
          echo "tags/$VERSION is free"

      - name: Sync trunk and listing assets
        run: |
          set -euo pipefail
          svn co "$SVN_URL" svn --depth immediates -q
          svn up --set-depth infinity -q svn/trunk svn/assets

          # trunk = exactly what ships; assets = the directory listing images,
          # which deliberately never enter the download. Both syncs use --delete,
          # so the guards having verified the asset source is non-empty is what
          # stands between a republish and a listing page stripped of images.
          rsync -a --delete --exclude '.svn' "release/build/${PLUGIN_SLUG}/" svn/trunk/
          rsync -a --delete --exclude '.svn' "current/.wordpress-org/" svn/assets/

          cd svn
          svn add --force trunk assets >/dev/null
          # Propagate deletions too, or removed files linger in the directory.
          svn status | awk '/^!/ {print $2}' | xargs -r svn delete --force >/dev/null
          echo "--- pending changes ---"
          svn status

      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        env:
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          AUTH=(--username "$SVN_USER" --password "$SVN_PASSWORD" --non-interactive --no-auth-cache)

          cd svn
          svn commit "${AUTH[@]}" -m "Release $VERSION"
          # Server-side copy, so the tag carries real history rather than
          # appearing as an unrelated pile of added files.
          svn copy "${AUTH[@]}" "$SVN_URL/trunk" "$SVN_URL/tags/$VERSION" -m "Tag $VERSION"

      - name: Confirm it went live
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # --non-interactive is required: without it svn tries to prompt on a
          # headless runner and exits 1, failing the check after a good publish.
          svn ls --non-interactive "$SVN_URL/tags/$VERSION" >/dev/null
          # Read the file to EOF FIRST, then match. Piping `svn cat` straight into
          # `grep -m1` reports a FAILED RELEASE AFTER A GOOD ONE: grep exits at the
          # match (line 7 of the readme), closes the pipe, svn cat dies of SIGPIPE
          # with 141, and `pipefail` fails the step. It passed for 1.3.x only because
          # the readme was short enough that svn finished writing first; the 1.4.0
          # changelog pushed it over and it became deterministic — reproduced 5/5.
          # A red run on a successful publish is worse than useless: the next person
          # re-runs it against an SVN tag that already exists.
          README="$(svn cat --non-interactive "$SVN_URL/trunk/readme.txt")"
          PUBLISHED="$(grep -m1 'Stable tag:' <<<"$README" | tr -d '\r')"
          echo "tags/$VERSION exists; trunk says: $PUBLISHED"
          echo "Listing: https://wordpress.org/plugins/$PLUGIN_SLUG (indexing can lag up to 72h)"

      - name: Dry run — nothing was published
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run. The changes listed above were NOT committed. Re-run with dry_run unchecked to publish."
